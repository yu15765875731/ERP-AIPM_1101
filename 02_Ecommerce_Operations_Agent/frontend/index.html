<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>项目二：电商运营 Agent V1.0 - 全景三栏流程图交互白板</title>
<style>
  body { margin: 0; background: #0f172a; color: #f8fafc; font-family: "Microsoft YaHei", sans-serif; overflow: hidden; }
  #toolbar {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 20;
    background: rgba(15, 23, 42, 0.92); border: 1px solid #334155; border-radius: 10px;
    padding: 8px 18px; display: flex; gap: 12px; align-items: center; box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  button {
    background: #1e293b; color: #e2e8f0; border: 1px solid #475569; border-radius: 6px;
    padding: 6px 12px; cursor: pointer; font-size: 13px; font-weight: 600;
  }
  button:hover { background: #2563eb; border-color: #3b82f6; color: #fff; }
  #viewport { width: 100vw; height: 100vh; cursor: grab; position: relative; }
  #viewport:active { cursor: grabbing; }
  #canvas-img { position: absolute; top: 0; left: 0; transform-origin: 0 0; user-select: none; -webkit-user-drag: none; box-shadow: 0 12px 48px rgba(0,0,0,0.6); }
</style>
</head>
<body>
<div id="toolbar">
  <span><strong>项目二：电商运营 Agent V1.0 · 全景三栏白板</strong>（滚轮缩放 / 按住拖拽）</span>
  <button onclick="fitScreen()">适应全屏</button>
  <button onclick="focusCol(0)">聚焦左栏：产品研究与消融</button>
  <button onclick="focusCol(1)">聚焦中栏：架构与工作台原型</button>
  <button onclick="focusCol(2)">聚焦右栏：技术链路与评估</button>
</div>
<div id="viewport">
  <img id="canvas-img" src="电商运营Agent_全景三栏大图_高清成品版.png" alt="项目二全景三栏流程图" />
</div>
<script>
  const vp = document.getElementById('viewport');
  const img = document.getElementById('canvas-img');
  let scale = 0.28, tx = 40, ty = 65, dragging = false, sx = 0, sy = 0;

  function apply() { img.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`; }
  function fitScreen() {
    const sX = (window.innerWidth - 60) / 4600;
    const sY = (window.innerHeight - 90) / 3660;
    scale = Math.min(sX, sY);
    tx = (window.innerWidth - 4600 * scale) / 2;
    ty = 65;
    apply();
  }
  function focusCol(idx) {
    scale = 0.58;
    const offsets = [40, 880, 2100];
    tx = 40 - offsets[idx] * scale;
    ty = 65;
    apply();
  }
  vp.addEventListener('wheel', (e) => {
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.12 : 0.89;
    const ns = Math.min(2.2, Math.max(0.15, scale * factor));
    tx = e.clientX - (e.clientX - tx) * (ns / scale);
    ty = e.clientY - (e.clientY - ty) * (ns / scale);
    scale = ns;
    apply();
  }, { passive: false });
  vp.addEventListener('mousedown', (e) => { dragging = true; sx = e.clientX - tx; sy = e.clientY - ty; });
  window.addEventListener('mousemove', (e) => { if (!dragging) return; tx = e.clientX - sx; ty = e.clientY - sy; apply(); });
  window.addEventListener('mouseup', () => { dragging = false; });
  img.onload = fitScreen;
</script>
</body>
</html>
